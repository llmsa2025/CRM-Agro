name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crmagro
          POSTGRES_PASSWORD: crmagro
          POSTGRES_DB: crmagro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crmagro" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crmagro:crmagro@localhost:5432/crmagro_test
      DIRECT_URL: postgresql://crmagro:crmagro@localhost:5432/crmagro_test
      DATABASE_URL_TEST: postgresql://crmagro:crmagro@localhost:5432/crmagro_test
      DIRECT_URL_TEST: postgresql://crmagro:crmagro@localhost:5432/crmagro_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret-0000
      CREDENTIALS_ENCRYPTION_KEY: ci-credentials-key-ci-credentials-key-0000
      EVOLUTION_API_URL: http://localhost:8081
      EVOLUTION_API_KEY: ci-evolution-key
      EVOLUTION_INSTANCE: crmagro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --no-bail typecheck
      - name: Migrations no banco de teste
        run: pnpm --filter @crmagro/db exec prisma migrate deploy
      # Os scripts de teste do core trocam a URL; aqui rodamos o vitest direto, já apontando para o banco de teste
      # (o DATABASE_URL do job já é o do banco de teste).
      - name: Testes do core
        run: pnpm --filter @crmagro/core exec vitest run
      - name: Testes do web
        if: always()
        run: pnpm --filter @crmagro/web test
